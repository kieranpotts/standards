<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="800" height="300" viewBox="0 0 800 300">
  <desc>A static illustration showing four parallel horizontal trunk lines, labelled (from top to bottom) "dev", "test", "ready", and "release". All trunks carry the same sequence of commits in order, but each is at a different advancement level: "dev" has the most commits (A through H), "test" has two fewer (A through F), "ready" has one fewer still (A through E), and "release" has the fewest (A through C). Dashed vertical connector lines show the integration points: dev F connects to test F, test E connects to ready E, and ready C connects to release C. This represents how code progresses through a series of trunk branches toward release, with each trunk staying in sync with those upstream.</desc>
  <defs>
    <style>
      svg text {
        fill: hsl(0, 0%, 75%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 16px;
        font-weight: 500;
      }
      .stroke\=neutral\|100           { stroke: hsl(0, 0%, 95%) }
      .stroke\=neutral\|200           { stroke: hsl(0, 0%, 85%) }
      .fill\=neutral\|800             { fill: hsl(0, 0%, 20%) }
      .fill\=neutral\|400             { fill: hsl(0, 0%, 60%) }
      .fill\=signature\|green\|200    { fill: hsl(70, 60%, 65%) }
      .stroke\=signature\|green\|400  { stroke: hsl(70, 60%, 45%) }
      .fill\=signature\|orange\|200   { fill: #ffc157 }
      .stroke\=signature\|orange\|400 { stroke: #e19a20 }
    </style>
  </defs>
  <g title="integration points">
    <path
      title="dev F to test F"
      d="M 560 80 L 560 100"
      class="stroke=neutral|200"
      stroke-width="3" stroke-linecap="round" stroke-dasharray="0 6" />
    <path
      title="test E to ready E"
      d="M 480 140 L 480 160"
      class="stroke=neutral|200"
      stroke-width="3" stroke-linecap="round" stroke-dasharray="0 6" />
    <path
      title="ready C to release C"
      d="M 320 200 L 320 220"
      class="stroke=neutral|200"
      stroke-width="3" stroke-linecap="round" stroke-dasharray="0 6" />
  </g>
  <g title="dev trunk">
    <path
      d="M 90 60 L 800 60"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
    <text x="80" y="65" text-anchor="end" class="fill=neutral|400">dev</text>
    <g title="commits">
      <circle cx="160" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="160" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
      <circle cx="240" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="240" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
      <circle cx="320" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="320" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
      <circle cx="400" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="400" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
      <circle cx="480" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="480" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
      <circle cx="560" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="560" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
      <circle cx="640" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="640" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
      <circle cx="720" cy="60" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="720" y="60" dy="0.35em" text-anchor="middle" class="fill=neutral|800">H</text>
    </g>
  </g>
  <g title="test trunk">
    <path
      d="M 90 120 L 800 120"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
    <text x="80" y="125" text-anchor="end" class="fill=neutral|400">test</text>
    <g title="commits">
      <circle cx="160" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="160" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
      <circle cx="240" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="240" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
      <circle cx="320" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="320" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
      <circle cx="400" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="400" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
      <circle cx="480" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="480" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
      <circle cx="560" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="560" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
    </g>
  </g>
  <g title="ready trunk">
    <path
      d="M 90 180 L 800 180"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
    <text x="80" y="185" text-anchor="end" class="fill=neutral|400">ready</text>
    <g title="commits">
      <circle cx="160" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="160" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
      <circle cx="240" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="240" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
      <circle cx="320" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="320" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
      <circle cx="400" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="400" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
      <circle cx="480" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="480" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
  </g>
  <g title="release trunk">
    <path
      d="M 90 240 L 800 240"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
    <text x="80" y="245" text-anchor="end" class="fill=neutral|400">release</text>
    <g title="commits">
      <circle cx="160" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="160" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
      <circle cx="240" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="240" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
      <circle cx="320" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="3" />
      <text x="320" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
  </g>
</svg>
