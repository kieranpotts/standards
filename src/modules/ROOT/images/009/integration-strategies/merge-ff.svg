<svg id="git-is-merge-ff" xmlns="http://www.w3.org/2000/svg" version="1.1" width="380" height="200" viewBox="70 80 380 200">
    <title>A fast-forward merge</title>
    <defs>
        <style>
      #git-is-merge-ff text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-is-merge-ff .stroke\=neutral\|100 { stroke: currentColor }
      #git-is-merge-ff .stroke\=neutral\|200 { stroke: currentColor }
      #git-is-merge-ff .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-is-merge-ff .fill\=neutral\|200 { fill: currentColor }
      #git-is-merge-ff .fill\=neutral\|400 { fill: currentColor }
      #git-is-merge-ff .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-is-merge-ff .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-is-merge-ff .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-is-merge-ff .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-is-merge-ff .stroke\=signature\|orange\|400 { stroke: #e19a20 }

      /* Cycle = 19.0s  (8 KFs each 1.5s + 7 pauses each 1s)
         KF timing (start% — end%):
           KF1:  0.000% —  7.895%   ( 0.0s —  1.5s)
           KF2: 13.158% — 21.053%   ( 2.5s —  4.0s)
           KF3: 26.316% — 34.211%   ( 5.0s —  6.5s)
           KF4: 39.474% — 47.368%   ( 7.5s —  9.0s)
           KF5: 52.632% — 60.526%   (10.0s — 11.5s)
           KF6: 65.789% — 73.684%   (12.5s — 14.0s)
           KF7: 78.947% — 86.842%   (15.0s — 16.5s)
           KF8: 92.105% — 100.000%  (17.5s — 19.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-is-merge-ff--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        7.895%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--commit-B-fade {
        0%, 13.158%   { opacity: 0; animation-timing-function: ease-out }
        21.053%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--trunk-AB-fade {
        0%, 13.158%   { opacity: 0; animation-timing-function: ease-out }
        21.053%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--label-target-opacity {
        0%    { opacity: 0; animation-timing-function: ease-out }
        7.895%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--label-target-kf2 {
        0%, 13.158%   { transform: translateX(0); animation-timing-function: ease-in-out }
        21.053%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-merge-ff--commit-C-fade {
        0%, 26.316%   { opacity: 0; animation-timing-function: ease-out }
        34.211%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--branch-BC-fade {
        0%, 26.316%   { opacity: 0; animation-timing-function: ease-out }
        34.211%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--label-source-opacity {
        0%, 26.316%   { opacity: 0; animation-timing-function: ease-out }
        34.211%       { opacity: 1 }
        78.947%       { opacity: 1; animation-timing-function: ease-in }
        86.842%, 100% { opacity: 0 }
      }
      @keyframes git-is-merge-ff--commit-D-fade {
        0%, 39.474%   { opacity: 0; animation-timing-function: ease-out }
        47.368%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--line-CD-fade {
        0%, 39.474%   { opacity: 0; animation-timing-function: ease-out }
        47.368%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--label-source-kf4 {
        0%, 39.474%   { transform: translateX(0); animation-timing-function: ease-in-out }
        47.368%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-merge-ff--commit-E-fade {
        0%, 52.632%   { opacity: 0; animation-timing-function: ease-out }
        60.526%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--line-DE-fade {
        0%, 52.632%   { opacity: 0; animation-timing-function: ease-out }
        60.526%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-ff--label-source-kf5 {
        0%, 52.632%   { transform: translateX(0); animation-timing-function: ease-in-out }
        60.526%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-merge-ff--label-target-kf6 {
        0%, 65.789%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        73.684%, 100% { transform: translate(220px, -60px) }
      }
      @keyframes git-is-merge-ff--commits-CDE-kf7 {
        0%, 78.947%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        86.842%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-is-merge-ff--branch-BC-kf7 {
        0%, 78.947%   { transform: rotate(0deg); animation-timing-function: ease-in-out }
        86.842%, 100% { transform: rotate(45deg) }
      }
      @keyframes git-is-merge-ff--label-source-kf7 {
        0%, 78.947%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        86.842%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-is-merge-ff--label-target-kf7 {
        0%, 78.947%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        86.842%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-is-merge-ff--scene-fade-out {
        0%, 92.105%   { opacity: 1; animation-timing-function: ease-in }
        100% { opacity: 0 }
      }
      #git-is-merge-ff-scene { animation: git-is-merge-ff--scene-fade-out 19.0s linear infinite }
      #git-is-merge-ff .commit-A { opacity: 0; animation: git-is-merge-ff--commit-A-fade 19.0s linear infinite }
      #git-is-merge-ff .commit-B { opacity: 0; animation: git-is-merge-ff--commit-B-fade 19.0s linear infinite }
      #git-is-merge-ff .trunk-AB { opacity: 0; animation: git-is-merge-ff--trunk-AB-fade 19.0s linear infinite }
      #git-is-merge-ff .commit-C { opacity: 0; animation: git-is-merge-ff--commit-C-fade  19.0s linear infinite }
      #git-is-merge-ff .branch-BC {
        opacity: 0;
        transform-origin: 180px 210px;
        animation:
          git-is-merge-ff--branch-BC-fade 19.0s linear infinite,
          git-is-merge-ff--branch-BC-kf7  19.0s linear infinite;
        animation-composition: add;
      }
      #git-is-merge-ff .commits-CDE {
        animation: git-is-merge-ff--commits-CDE-kf7 19.0s linear infinite;
        animation-composition: add;
      }
      #git-is-merge-ff .commit-D { opacity: 0; animation: git-is-merge-ff--commit-D-fade  19.0s linear infinite }
      #git-is-merge-ff .commit-E { opacity: 0; animation: git-is-merge-ff--commit-E-fade  19.0s linear infinite }
      #git-is-merge-ff .line-CD { opacity: 0; animation: git-is-merge-ff--line-CD-fade   19.0s linear infinite }
      #git-is-merge-ff .line-DE { opacity: 0; animation: git-is-merge-ff--line-DE-fade   19.0s linear infinite }
      #git-is-merge-ff .label-source {
        opacity: 0;
        animation:
          git-is-merge-ff--label-source-opacity 19.0s linear infinite,
          git-is-merge-ff--label-source-kf4     19.0s linear infinite,
          git-is-merge-ff--label-source-kf5     19.0s linear infinite,
          git-is-merge-ff--label-source-kf7     19.0s linear infinite;
        animation-composition: replace, add, add, add;
      }
      #git-is-merge-ff .label-target {
        opacity: 0;
        animation:
          git-is-merge-ff--label-target-opacity 19.0s linear infinite,
          git-is-merge-ff--label-target-kf2 19.0s linear infinite,
          git-is-merge-ff--label-target-kf6 19.0s linear infinite,
          git-is-merge-ff--label-target-kf7 19.0s linear infinite;
        animation-composition: add;
      }
        
      @media (prefers-reduced-motion: reduce) {
        #git-is-merge-ff, #git-is-merge-ff * { animation-delay: -17.67s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-is-merge-ff-scene">
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commits-CDE" title="commits C, D, E (animates onto trunk at KF8)">
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    </g>
    <g class="label-source" title="source -> C, animates to D, then E">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">source</text>
    </g>
    <g class="label-target" title="target -> A, animates to B, then E">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">target</text>
    </g>
    </g>
</svg>
