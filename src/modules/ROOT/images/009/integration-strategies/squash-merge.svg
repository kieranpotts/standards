<svg id="git-is-squash-merge" xmlns="http://www.w3.org/2000/svg" version="1.1" width="460" height="200" viewBox="70 80 460 200">
    <title>A squash merge</title>
    <defs>
        <style>
      #git-is-squash-merge text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-is-squash-merge .stroke\=neutral\|100 { stroke: currentColor }
      #git-is-squash-merge .stroke\=neutral\|200 { stroke: currentColor }
      #git-is-squash-merge .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-is-squash-merge .fill\=neutral\|200 { fill: currentColor }
      #git-is-squash-merge .fill\=neutral\|400 { fill: currentColor }
      #git-is-squash-merge .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-is-squash-merge .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-is-squash-merge .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-is-squash-merge .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-is-squash-merge .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      #git-is-squash-merge .fill\=signature\|purple\|200 { fill: hsl(270, 51%, 45%) }
      #git-is-squash-merge .stroke\=signature\|purple\|400 { stroke: hsl(270, 51%, 45%) }

      /* Cycle = 25.0s  (9 KFs each 1.5s + 8 pauses each 1s + 2s pause + 1.5s fade)
         KF timing (start% — end%):
           KF1:  0.000% —  6.000%   ( 0.0s —  1.5s)
           KF2: 10.000% — 16.000%   ( 2.5s —  4.0s)
           KF3: 20.000% — 26.000%   ( 5.0s —  6.5s)
           KF4: 30.000% — 36.000%   ( 7.5s —  9.0s)
           KF5: 40.000% — 46.000%   (10.0s — 11.5s)
           KF6: 50.000% — 56.000%   (12.5s — 14.0s)
           KF7: 60.000% — 66.000%   (15.0s — 16.5s)
                 62.000% mid-KF      (15.5s) ghost labels peak; D/E begin translating
           KF8: 70.000% — 76.000%   (17.5s — 19.0s)
           KF9: 80.000% — 86.000%   (20.0s — 21.5s)
                 80.000% — 82.000%   label-source fades out
                 82.000% — 86.000%   C/D/E commits and branch lines fade out
           fade: 94.000% — 100.000% (23.5s — 25.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-is-squash-merge--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--commit-B-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--trunk-AB-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--label-target-opacity {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--label-target-kf2 {
        0%, 10.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        16.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-squash-merge--commit-C-fade {
        0%, 20.000%          { opacity: 0; animation-timing-function: ease-out }
        26.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--branch-BC-fade {
        0%, 20.000%          { opacity: 0; animation-timing-function: ease-out }
        26.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--label-source-opacity {
        0%, 20.000%          { opacity: 0; animation-timing-function: ease-out }
        26.000%, 80.000%     { opacity: 1; animation-timing-function: ease-in }
        82.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--commit-D-fade {
        0%, 30.000%          { opacity: 0; animation-timing-function: ease-out }
        36.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--line-CD-fade {
        0%, 30.000%          { opacity: 0; animation-timing-function: ease-out }
        36.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--label-source-kf4 {
        0%, 30.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        36.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-squash-merge--commit-E-fade {
        0%, 40.000%          { opacity: 0; animation-timing-function: ease-out }
        46.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--line-DE-fade {
        0%, 40.000%          { opacity: 0; animation-timing-function: ease-out }
        46.000%, 82.000%     { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100%        { opacity: 0 }
      }
      @keyframes git-is-squash-merge--label-source-kf5 {
        0%, 40.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        46.000%, 100% { transform: translateX(80px) }
      }
      #git-is-squash-merge .commit-A { opacity: 0; animation: git-is-squash-merge--commit-A-fade 25.0s linear infinite }
      #git-is-squash-merge .commit-B { opacity: 0; animation: git-is-squash-merge--commit-B-fade 25.0s linear infinite }
      #git-is-squash-merge .trunk-AB { opacity: 0; animation: git-is-squash-merge--trunk-AB-fade 25.0s linear infinite }
      #git-is-squash-merge .commit-C { opacity: 0; animation: git-is-squash-merge--commit-C-fade  25.0s linear infinite }
      #git-is-squash-merge .branch-BC { opacity: 0; animation: git-is-squash-merge--branch-BC-fade 25.0s linear infinite }
      #git-is-squash-merge .commit-D { opacity: 0; animation: git-is-squash-merge--commit-D-fade  25.0s linear infinite }
      #git-is-squash-merge .commit-E { opacity: 0; animation: git-is-squash-merge--commit-E-fade  25.0s linear infinite }
      #git-is-squash-merge .line-CD { opacity: 0; animation: git-is-squash-merge--line-CD-fade   25.0s linear infinite }
      #git-is-squash-merge .line-DE { opacity: 0; animation: git-is-squash-merge--line-DE-fade   25.0s linear infinite }
      #git-is-squash-merge .label-source {
        opacity: 0;
        animation:
          git-is-squash-merge--label-source-opacity 25.0s linear infinite,
          git-is-squash-merge--label-source-kf4     25.0s linear infinite,
          git-is-squash-merge--label-source-kf5     25.0s linear infinite;
        animation-composition: replace, add, add;
      }
      @keyframes git-is-squash-merge--label-target-kf8 {
        0%, 70.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        76.000%, 100% { transform: translateX(80px) }
      }
      #git-is-squash-merge .label-target {
        opacity: 0;
        animation:
          git-is-squash-merge--label-target-opacity 25.0s linear infinite,
          git-is-squash-merge--label-target-kf2  25.0s linear infinite,
          git-is-squash-merge--label-target-kf6  25.0s linear infinite,
          git-is-squash-merge--label-target-kf8  25.0s linear infinite;
        animation-composition: add;
      }
      @keyframes git-is-squash-merge--commit-F-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--trunk-BF-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--label-target-kf6 {
        0%, 50.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        56.000%, 100% { transform: translateX(80px) }
      }
      #git-is-squash-merge .commit-F { opacity: 0; animation: git-is-squash-merge--commit-F-fade 25.0s linear infinite }
      #git-is-squash-merge .trunk-BF { opacity: 0; animation: git-is-squash-merge--trunk-BF-fade 25.0s linear infinite }
      @keyframes git-is-squash-merge--commits-ghost-fade {
        0%, 60.000%            { opacity: 0; animation-timing-function: ease-out }
        62.000%, 66.000%, 100% { opacity: 0.25 }
      }
      #git-is-squash-merge .commit-C-ghost { opacity: 0; animation: git-is-squash-merge--commits-ghost-fade 25.0s linear infinite }
      @keyframes git-is-squash-merge--commit-D-ghost-kf7 {
        0%, 62.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        66.000%, 100% { transform: translateX(-80px) }
      }
      #git-is-squash-merge .commit-D-ghost {
        opacity: 0;
        animation:
          git-is-squash-merge--commits-ghost-fade 25.0s linear infinite,
          git-is-squash-merge--commit-D-ghost-kf7 25.0s linear infinite;
      }
      @keyframes git-is-squash-merge--commit-E-ghost-kf7 {
        0%, 62.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        66.000%, 100% { transform: translateX(-160px) }
      }
      #git-is-squash-merge .commit-E-ghost {
        opacity: 0;
        animation:
          git-is-squash-merge--commits-ghost-fade 25.0s linear infinite,
          git-is-squash-merge--commit-E-ghost-kf7 25.0s linear infinite;
      }
      @keyframes git-is-squash-merge--ghost-labels-fade {
        0%, 60.000%        { opacity: 0; animation-timing-function: ease-out }
        62.000%            { opacity: 0.25; animation-timing-function: ease-in }
        66.000%, 100%      { opacity: 0 }
      }
      #git-is-squash-merge .ghost-label-C { opacity: 0; animation: git-is-squash-merge--ghost-labels-fade 25.0s linear infinite }
      #git-is-squash-merge .ghost-label-D {
        opacity: 0;
        animation:
          git-is-squash-merge--ghost-labels-fade  25.0s linear infinite,
          git-is-squash-merge--commit-D-ghost-kf7 25.0s linear infinite;
      }
      #git-is-squash-merge .ghost-label-E {
        opacity: 0;
        animation:
          git-is-squash-merge--ghost-labels-fade  25.0s linear infinite,
          git-is-squash-merge--commit-E-ghost-kf7 25.0s linear infinite;
      }
      @keyframes git-is-squash-merge--commit-Gstar-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        76.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-squash-merge--trunk-FGstar-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        76.000%, 100% { opacity: 1 }
      }
      #git-is-squash-merge .commit-Gstar { opacity: 0; animation: git-is-squash-merge--commit-Gstar-fade 25.0s linear infinite }
      #git-is-squash-merge .trunk-FGstar { opacity: 0; animation: git-is-squash-merge--trunk-FGstar-fade 25.0s linear infinite }
      @keyframes git-is-squash-merge--scene-fade-out {
        0%, 94.000%   { opacity: 1; animation-timing-function: ease-in }
        100%      { opacity: 0 }
      }
      #git-is-squash-merge-scene { animation: git-is-squash-merge--scene-fade-out 25.0s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-is-squash-merge, #git-is-squash-merge * { animation-delay: -23.25s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-is-squash-merge-scene">
    <g class="trunk-FGstar" title="trunk F-G*">
        <path
      d="M 260 210 L 340 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-BF" title="trunk B-F">
        <path
      d="M 180 210 L 260 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commits-CDE" title="commits C, D, E">
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    </g>
    <g class="commit-F" title="commit F">
        <circle cx="260" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="260" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
    </g>
    <g class="commit-C-ghost" title="commit C (ghost)">
        <circle cx="340" cy="210" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
    </g>
    <g class="commit-D-ghost" title="commit D (ghost)">
        <circle cx="420" cy="210" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
    </g>
    <g class="commit-E-ghost" title="commit E (ghost)">
        <circle cx="500" cy="210" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
    </g>
    <text class="ghost-label-C fill=neutral|800" x="340" y="210" dy="0.35em" text-anchor="middle">C</text>
    <text class="ghost-label-D fill=neutral|800" x="420" y="210" dy="0.35em" text-anchor="middle">D</text>
    <text class="ghost-label-E fill=neutral|800" x="500" y="210" dy="0.35em" text-anchor="middle">E</text>
    <g class="commit-Gstar" title="commit G*">
        <circle cx="340" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="340" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G*</text>
    </g>
    <g class="label-source" title="source -> C, animates to D, then E">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">source</text>
    </g>
    <g class="label-target" title="target -> A, animates to B, then F">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">target</text>
    </g>
    </g>
</svg>
