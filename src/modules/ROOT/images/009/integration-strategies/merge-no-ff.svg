<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="420" height="200" viewBox="70 80 420 200">
  <desc>TODO</desc>
  <defs>
    <style>
      svg text {
        fill: hsl(0, 0%, 75%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 16px;
        font-weight: 500;
      }
      .stroke\=neutral\|100           { stroke: hsl(0, 0%, 95%) }
      .stroke\=neutral\|200           { stroke: hsl(0, 0%, 85%) }
      .fill\=neutral\|100             { fill: hsl(0, 0%, 95%) }
      .fill\=neutral\|200             { fill: hsl(0, 0%, 85%) }
      .fill\=neutral\|400             { fill: hsl(0, 0%, 60%) }
      .fill\=neutral\|800             { fill: hsl(0, 0%, 20%) }
      .fill\=signature\|green\|200    { fill: hsl(70, 60%, 65%) }
      .stroke\=signature\|green\|400  { stroke: hsl(70, 60%, 45%) }
      .fill\=signature\|orange\|200   { fill: #ffc157 }
      .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      .fill\=signature\|purple\|200   { fill: hsl(270, 51%, 45%) }
      .stroke\=signature\|purple\|400 { stroke: hsl(270, 51%, 45%) }

      /* Cycle = 25.0s  (9 KFs each 1.5s + 8 pauses each 1s + 2s pause + 1.5s fade)
         KF timing (start% — end%):
           KF1:  0.000% —  6.000%   ( 0.0s —  1.5s)
           KF2: 10.000% — 16.000%   ( 2.5s —  4.0s)
           KF3: 20.000% — 26.000%   ( 5.0s —  6.5s)
           KF4: 30.000% — 36.000%   ( 7.5s —  9.0s)
           KF5: 40.000% — 46.000%   (10.0s — 11.5s)
           KF6: 50.000% — 56.000%   (12.5s — 14.0s)
           KF7: 60.000% — 66.000%   (15.0s — 16.5s)
           KF8: 70.000% — 76.000%   (17.5s — 19.0s)
           KF9: 80.000% — 86.000%   (20.0s — 21.5s)
           fade: 94.000% — 100.000% (23.5s — 25.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes commit-B-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes trunk-AB-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes label-target-opacity {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes label-target-kf2 {
        0%, 10.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        16.000%, 100% { transform: translateX(80px) }
      }
      @keyframes commit-C-fade {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%, 100% { opacity: 1 }
      }
      @keyframes branch-BC-fade {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%, 100% { opacity: 1 }
      }
      @keyframes label-source-opacity {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%       { opacity: 1 }
        80.000%       { opacity: 1; animation-timing-function: ease-in }
        86.000%, 100% { opacity: 0 }
      }
      @keyframes commit-D-fade {
        0%, 30.000%   { opacity: 0; animation-timing-function: ease-out }
        36.000%, 100% { opacity: 1 }
      }
      @keyframes line-CD-fade {
        0%, 30.000%   { opacity: 0; animation-timing-function: ease-out }
        36.000%, 100% { opacity: 1 }
      }
      @keyframes label-source-kf4 {
        0%, 30.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        36.000%, 100% { transform: translateX(80px) }
      }
      @keyframes commit-E-fade {
        0%, 40.000%   { opacity: 0; animation-timing-function: ease-out }
        46.000%, 100% { opacity: 1 }
      }
      @keyframes line-DE-fade {
        0%, 40.000%   { opacity: 0; animation-timing-function: ease-out }
        46.000%, 100% { opacity: 1 }
      }
      @keyframes label-source-kf5 {
        0%, 40.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        46.000%, 100% { transform: translateX(80px) }
      }
      .commit-A { opacity: 0; animation: commit-A-fade 25.0s linear infinite }
      .commit-B { opacity: 0; animation: commit-B-fade 25.0s linear infinite }
      .trunk-AB { opacity: 0; animation: trunk-AB-fade 25.0s linear infinite }
      .commit-C  { opacity: 0; animation: commit-C-fade  25.0s linear infinite }
      .branch-BC { opacity: 0; animation: branch-BC-fade 25.0s linear infinite }
      .commit-D  { opacity: 0; animation: commit-D-fade  25.0s linear infinite }
      .commit-E  { opacity: 0; animation: commit-E-fade  25.0s linear infinite }
      .line-CD   { opacity: 0; animation: line-CD-fade   25.0s linear infinite }
      .line-DE   { opacity: 0; animation: line-DE-fade   25.0s linear infinite }
      .label-source {
        opacity: 0;
        animation:
          label-source-opacity 25.0s linear infinite,
          label-source-kf4     25.0s linear infinite,
          label-source-kf5     25.0s linear infinite;
        animation-composition: replace, add, add;
      }
      .label-target {
        opacity: 0;
        animation:
          label-target-opacity 25.0s linear infinite,
          label-target-kf2  25.0s linear infinite,
          label-target-kf6  25.0s linear infinite,
          label-target-kf7  25.0s linear infinite,
          label-target-kf8  25.0s linear infinite;
        animation-composition: add;
      }
      @keyframes commit-F-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes trunk-BF-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes label-target-kf6 {
        0%, 50.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        56.000%, 100% { transform: translateX(80px) }
      }
      .commit-F { opacity: 0; animation: commit-F-fade 25.0s linear infinite }
      .trunk-BF { opacity: 0; animation: trunk-BF-fade 25.0s linear infinite }
      @keyframes commit-G-fade {
        0%, 60.000%   { opacity: 0; animation-timing-function: ease-out }
        66.000%, 100% { opacity: 1 }
      }
      @keyframes trunk-FG-fade {
        0%, 60.000%   { opacity: 0; animation-timing-function: ease-out }
        66.000%, 100% { opacity: 1 }
      }
      @keyframes label-target-kf7 {
        0%, 60.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        66.000%, 100% { transform: translateX(80px) }
      }
      .commit-G { opacity: 0; animation: commit-G-fade 25.0s linear infinite }
      .trunk-FG { opacity: 0; animation: trunk-FG-fade 25.0s linear infinite }
      @keyframes commit-H-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        76.000%, 100% { opacity: 1 }
      }
      @keyframes line-EH-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        76.000%, 100% { opacity: 1 }
      }
      @keyframes line-GH-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        76.000%, 100% { opacity: 1 }
      }
      @keyframes label-target-kf8 {
        0%, 70.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        76.000%, 100% { transform: translateX(120px) }
      }
      .commit-H { opacity: 0; animation: commit-H-fade 25.0s linear infinite }
      .line-EH  { opacity: 0; animation: line-EH-fade  25.0s linear infinite }
      .line-GH  { opacity: 0; animation: line-GH-fade  25.0s linear infinite }
      @keyframes scene-fade-out {
        0%, 94.000%   { opacity: 1; animation-timing-function: ease-in }
        100%      { opacity: 0 }
      }
      #scene { animation: scene-fade-out 25.0s linear infinite }
    </style>
  </defs>
  <g id="scene">
  <g class="line-EH" title="line E-H">
    <path
      d="M 400 150 L 460 210"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="line-GH" title="line G-H">
    <path
      d="M 340 210 L 460 210"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="trunk-FG" title="trunk F-G">
    <path
      d="M 260 210 L 340 210"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="trunk-BF" title="trunk B-F">
    <path
      d="M 180 210 L 260 210"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="branch-BC" title="branch B-C">
    <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="trunk-AB" title="trunk A-B">
    <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="commit-A" title="commit A">
    <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="3" />
    <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
  </g>
  <g class="commit-B" title="commit B">
    <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="3" />
    <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
  </g>
  <g class="commits-CDE" title="commits C, D, E (animates onto trunk at KF8)">
  <g class="line-CD" title="line C-D">
    <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="commit-C" title="commit C">
    <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="3" />
    <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
  </g>
  <g class="line-DE" title="line D-E">
    <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="5" stroke-miterlimit="10" />
  </g>
  <g class="commit-D" title="commit D">
    <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="3" />
    <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
  </g>
  <g class="commit-E" title="commit E">
    <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="3" />
    <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
  </g>
  </g>
  <g class="commit-G" title="commit G">
    <circle cx="340" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="3" />
    <text x="340" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
  </g>
  <g class="commit-F" title="commit F">
    <circle cx="260" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="3" />
    <text x="260" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
  </g>
  <g class="commit-H" title="commit H">
    <circle cx="460" cy="210" r="20"
      class="fill=signature|purple|200 stroke=signature|purple|400"
      stroke-width="3" />
    <text x="460" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|100">H</text>
  </g>
  <g class="label-source" title="source -> C, animates to D, then E">
    <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
    <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">source</text>
  </g>
  <g class="label-target" title="target -> A, animates to B, then E">
    <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
    <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">target</text>
  </g>
  </g>
</svg>
