<svg id="git-is-merge-explicit-no-ff" xmlns="http://www.w3.org/2000/svg" version="1.1" width="420" height="200" viewBox="70 80 420 200">
    <title>An explicit no-fast-forward merge</title>
    <defs>
        <style>
      #git-is-merge-explicit-no-ff text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-is-merge-explicit-no-ff .stroke\=neutral\|100 { stroke: currentColor }
      #git-is-merge-explicit-no-ff .stroke\=neutral\|200 { stroke: currentColor }
      #git-is-merge-explicit-no-ff .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-is-merge-explicit-no-ff .fill\=neutral\|200 { fill: currentColor }
      #git-is-merge-explicit-no-ff .fill\=neutral\|400 { fill: currentColor }
      #git-is-merge-explicit-no-ff .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-is-merge-explicit-no-ff .fill\=signature\|green\|200 { fill: hsl(70, 51.429%, 65%) }
      #git-is-merge-explicit-no-ff .stroke\=signature\|green\|400 { stroke: hsl(70, 51.429%, 45%) }
      #git-is-merge-explicit-no-ff .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-is-merge-explicit-no-ff .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      #git-is-merge-explicit-no-ff .fill\=signature\|purple\|200 { fill: hsl(270, 51%, 45%) }
      #git-is-merge-explicit-no-ff .stroke\=signature\|purple\|400 { stroke: hsl(270, 51%, 45%) }

      /* Cycle = 20.0s  (7 KFs each 1.5s + 6 pauses each 1s + 2s pause + 1.5s fade)
         KF timing (start% — end%):
           KF1:  0.000% —  7.500%   ( 0.0s —  1.5s)
           KF2: 12.500% — 20.000%   ( 2.5s —  4.0s)
           KF3: 25.000% — 32.500%   ( 5.0s —  6.5s)
           KF4: 37.500% — 45.000%   ( 7.5s —  9.0s)
           KF5: 50.000% — 57.500%   (10.0s — 11.5s)
           KF6: 62.500% — 70.000%   (12.5s — 14.0s)
           KF7: 75.000% — 82.500%   (15.0s — 16.5s)
           fade: 92.500% — 100.000% (18.5s — 20.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-is-merge-explicit-no-ff--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        7.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--commit-B-fade {
        0%, 12.500%   { opacity: 0; animation-timing-function: ease-out }
        20.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--trunk-AB-fade {
        0%, 12.500%   { opacity: 0; animation-timing-function: ease-out }
        20.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--label-target-opacity {
        0%    { opacity: 0; animation-timing-function: ease-out }
        7.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--label-target-kf2 {
        0%, 12.500%   { transform: translateX(0); animation-timing-function: ease-in-out }
        20.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-merge-explicit-no-ff--commit-C-fade {
        0%, 25.000%   { opacity: 0; animation-timing-function: ease-out }
        32.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--branch-BC-fade {
        0%, 25.000%   { opacity: 0; animation-timing-function: ease-out }
        32.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--label-source-opacity {
        0%, 25.000%   { opacity: 0; animation-timing-function: ease-out }
        32.500%       { opacity: 1 }
        75.000%       { opacity: 1; animation-timing-function: ease-in }
        82.500%, 100% { opacity: 0 }
      }
      @keyframes git-is-merge-explicit-no-ff--commit-D-fade {
        0%, 37.500%   { opacity: 0; animation-timing-function: ease-out }
        45.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--line-CD-fade {
        0%, 37.500%   { opacity: 0; animation-timing-function: ease-out }
        45.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--label-source-kf4 {
        0%, 37.500%   { transform: translateX(0); animation-timing-function: ease-in-out }
        45.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-merge-explicit-no-ff--commit-E-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        57.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--line-DE-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        57.500%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--label-source-kf5 {
        0%, 50.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        57.500%, 100% { transform: translateX(80px) }
      }
      #git-is-merge-explicit-no-ff .commit-A { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-A-fade 20.0s linear infinite }
      #git-is-merge-explicit-no-ff .commit-B { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-B-fade 20.0s linear infinite }
      #git-is-merge-explicit-no-ff .trunk-AB { opacity: 0; animation: git-is-merge-explicit-no-ff--trunk-AB-fade 20.0s linear infinite }
      #git-is-merge-explicit-no-ff .commit-C { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-C-fade  20.0s linear infinite }
      #git-is-merge-explicit-no-ff .branch-BC { opacity: 0; animation: git-is-merge-explicit-no-ff--branch-BC-fade 20.0s linear infinite }
      #git-is-merge-explicit-no-ff .commit-D { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-D-fade  20.0s linear infinite }
      #git-is-merge-explicit-no-ff .commit-E { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-E-fade  20.0s linear infinite }
      #git-is-merge-explicit-no-ff .line-CD { opacity: 0; animation: git-is-merge-explicit-no-ff--line-CD-fade   20.0s linear infinite }
      #git-is-merge-explicit-no-ff .line-DE { opacity: 0; animation: git-is-merge-explicit-no-ff--line-DE-fade   20.0s linear infinite }
      #git-is-merge-explicit-no-ff .label-source {
        opacity: 0;
        animation:
          git-is-merge-explicit-no-ff--label-source-opacity 20.0s linear infinite,
          git-is-merge-explicit-no-ff--label-source-kf4     20.0s linear infinite,
          git-is-merge-explicit-no-ff--label-source-kf5     20.0s linear infinite;
        animation-composition: replace, add, add;
      }
      #git-is-merge-explicit-no-ff .label-target {
        opacity: 0;
        animation:
          git-is-merge-explicit-no-ff--label-target-opacity 20.0s linear infinite,
          git-is-merge-explicit-no-ff--label-target-kf2  20.0s linear infinite,
          git-is-merge-explicit-no-ff--label-target-kf6  20.0s linear infinite;
        animation-composition: add;
      }
      @keyframes git-is-merge-explicit-no-ff--label-target-kf6 {
        0%, 62.500%   { transform: translateX(0); animation-timing-function: ease-in-out }
        70.000%, 100% { transform: translateX(280px) }
      }
      @keyframes git-is-merge-explicit-no-ff--commit-F-fade {
        0%, 62.500%   { opacity: 0; animation-timing-function: ease-out }
        70.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--line-EF-fade {
        0%, 62.500%   { opacity: 0; animation-timing-function: ease-out }
        70.000%, 100% { opacity: 1 }
      }
      @keyframes git-is-merge-explicit-no-ff--line-BF-fade {
        0%, 62.500%   { opacity: 0; animation-timing-function: ease-out }
        70.000%, 100% { opacity: 1 }
      }
      #git-is-merge-explicit-no-ff .commit-F { opacity: 0; animation: git-is-merge-explicit-no-ff--commit-F-fade 20.0s linear infinite }
      #git-is-merge-explicit-no-ff .line-EF { opacity: 0; animation: git-is-merge-explicit-no-ff--line-EF-fade  20.0s linear infinite }
      #git-is-merge-explicit-no-ff .line-BF { opacity: 0; animation: git-is-merge-explicit-no-ff--line-BF-fade  20.0s linear infinite }
      @keyframes git-is-merge-explicit-no-ff--scene-fade-out {
        0%, 92.500%   { opacity: 1; animation-timing-function: ease-in }
        100%      { opacity: 0 }
      }
      #git-is-merge-explicit-no-ff-scene { animation: git-is-merge-explicit-no-ff--scene-fade-out 20.0s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-is-merge-explicit-no-ff, #git-is-merge-explicit-no-ff * { animation-delay: -18.6s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-is-merge-explicit-no-ff-scene">
    <g class="line-EF" title="line E-F">
        <path
      d="M 400 150 L 460 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="line-BF" title="line B-F">
        <path
      d="M 180 210 L 460 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commits-CDE" title="commits C, D, E (animates onto trunk at KF8)">
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    </g>
    <g class="commit-F" title="commit F">
        <circle cx="460" cy="210" r="20"
      class="fill=signature|purple|200 stroke=signature|purple|400"
      stroke-width="2" />
        <text x="460" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|100">F</text>
    </g>
    <g class="label-source" title="source -> C, animates to D, then E">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">source</text>
    </g>
    <g class="label-target" title="target -> A, animates to B, then E">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">target</text>
    </g>
    </g>
</svg>
