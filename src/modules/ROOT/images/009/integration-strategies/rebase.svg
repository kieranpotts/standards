<svg id="git-is-rebase" xmlns="http://www.w3.org/2000/svg" version="1.1" width="520" height="200" viewBox="70 80 520 200">
    <title>Rebasing a branch onto another</title>
    <defs>
        <style>
      #git-is-rebase text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-is-rebase .stroke\=neutral\|100 { stroke: currentColor }
      #git-is-rebase .stroke\=neutral\|200 { stroke: currentColor }
      #git-is-rebase .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-is-rebase .fill\=neutral\|200 { fill: currentColor }
      #git-is-rebase .fill\=neutral\|400 { fill: currentColor }
      #git-is-rebase .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-is-rebase .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-is-rebase .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-is-rebase .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-is-rebase .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      /* Cycle = 27.5s (9 KFs each 1.5s + 8 pauses 1s each + pause 2s + G/F fade 2.5s + label moves 3s + KF9 1.5s + KF10 1.5s + final fade)
         KF timing (start% — end%, absolute time):
           KF1:  0.000% —  5.455%   ( 0.0s —  1.5s)
           KF2:  10% — 16%   ( 2.5s —  4.0s)
           KF3: 18.182% — 23.636%   ( 5.0s —  6.5s)
           KF4: 27.273% — 32.727%   ( 7.5s —  9.0s)
           KF5: 36.364% — 41.818%   (10.0s — 11.5s)
           KF6: 45.455% — 50.909%   (12.5s — 14.0s)
           KF7: 54.545% — 60.000%   (15.0s — 16.5s)
           KF7.5: 60.000% — 67.273% (16.5s — 18.5s) [pause, do nothing]
           KF8: 70.000% — 76.000%   (17.5s — 19.0s) [G fade, F fade, label move to E]
           pause: 76.000% — 80.000% (19.0s — 20.0s)
           KF9: 80.000% — 88.000%   (20.0s — 22.0s) [F* appears, target moves]
           KF10: 88.000% — 96.000%  (22.0s — 24.0s) [G* appears, target moves]
           fade: 96.000% — 100.000% (24.0s — 25.0s) */
      @keyframes git-is-rebase--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--commit-B-fade {
        0%, 10%    { opacity: 0; animation-timing-function: ease-out }
        16%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--trunk-AB-fade {
        0%, 10%    { opacity: 0; animation-timing-function: ease-out }
        16%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--label-target-opacity {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--label-target-kf2 {
        0%, 10%    { transform: translateX(0); animation-timing-function: ease-in-out }
        16%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-rebase--commit-C-fade {
        0%, 18.182%   { opacity: 0; animation-timing-function: ease-out }
        23.636%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--branch-BC-fade {
        0%, 18.182%   { opacity: 0; animation-timing-function: ease-out }
        23.636%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--commit-D-fade {
        0%, 27.273%   { opacity: 0; animation-timing-function: ease-out }
        32.727%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--line-CD-fade {
        0%, 27.273%   { opacity: 0; animation-timing-function: ease-out }
        32.727%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--commit-E-fade {
        0%, 36.364%   { opacity: 0; animation-timing-function: ease-out }
        41.818%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--line-DE-fade {
        0%, 36.364%   { opacity: 0; animation-timing-function: ease-out }
        41.818%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--commit-F-fade {
        0%, 45.455%   { opacity: 0; animation-timing-function: ease-out }
        50.909%, 67.273% { opacity: 1; animation-timing-function: ease-in }
        70.073%, 100% { opacity: 0 }
      }
      @keyframes git-is-rebase--trunk-BF-fade {
        0%, 45.455%   { opacity: 0; animation-timing-function: ease-out }
        50.909%, 67.273% { opacity: 1; animation-timing-function: ease-in }
        70.073%, 100% { opacity: 0 }
      }
      @keyframes git-is-rebase--commit-G-fade {
        0%, 54.545%   { opacity: 0; animation-timing-function: ease-out }
        60.000%, 67.273% { opacity: 1; animation-timing-function: ease-in }
        70.073%, 100% { opacity: 0 }
      }
      @keyframes git-is-rebase--trunk-FG-fade {
        0%, 54.545%   { opacity: 0; animation-timing-function: ease-out }
        60.000%, 67.273% { opacity: 1; animation-timing-function: ease-in }
        70.073%, 100% { opacity: 0 }
      }
      @keyframes git-is-rebase--commit-Gstar-fade {
        0%, 76.928%   { opacity: 0; animation-timing-function: ease-out }
        82.383%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--line-F-Gstar-fade {
        0%, 76.928%   { opacity: 0; animation-timing-function: ease-out }
        82.383%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--commit-Fstar-fade {
        0%, 74.128%   { opacity: 0; animation-timing-function: ease-out }
        79.897%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--line-C-Fstar-fade {
        0%, 74.128%   { opacity: 0; animation-timing-function: ease-out }
        79.897%, 100% { opacity: 1 }
      }
      @keyframes git-is-rebase--label-source-opacity {
        0%, 18.182%   { opacity: 0; animation-timing-function: ease-out }
        23.636%, 74.128% { opacity: 1; animation-timing-function: ease-in }
        79.897%, 100% { opacity: 0 }
      }
      @keyframes git-is-rebase--label-source-kf4 {
        0%, 27.273%   { transform: translateX(0); animation-timing-function: ease-in-out }
        32.727%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-rebase--label-source-kf5 {
        0%, 36.364%   { transform: translateX(0); animation-timing-function: ease-in-out }
        41.818%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-rebase--label-source-kf6 {
        0%, 74.128%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        79.897%, 100% { transform: translate(20px, 131px) }
      }
      @keyframes git-is-rebase--label-target-kf6 {
        0%, 45.455%   { transform: translateX(0); animation-timing-function: ease-in-out }
        50.909%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-rebase--label-target-kf7 {
        0%, 54.545%   { transform: translateX(0); animation-timing-function: ease-in-out }
        60.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-is-rebase--label-target-kf8a {
        0%, 67.273%   { transform: translateX(0); animation-timing-function: ease-in-out }
        70.073%, 100% { transform: translateX(-160px) }
      }
      @keyframes git-is-rebase--label-target-kf8b {
        0%, 70.073%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        72.873%, 100% { transform: translate(220px, -60px) }
      }
      @keyframes git-is-rebase--label-target-kf9 {
        0%, 72.328%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        75.128%, 100% { transform: translate(60px, 60px) }
      }
      @keyframes git-is-rebase--label-target-kf10 {
        0%, 75.128%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        77.928%, 100% { transform: translate(80px, 0) }
      }
      #git-is-rebase .commit-A { opacity: 0; animation: git-is-rebase--commit-A-fade 27.5s linear infinite }
      #git-is-rebase .commit-B { opacity: 0; animation: git-is-rebase--commit-B-fade 27.5s linear infinite }
      #git-is-rebase .commit-C { opacity: 0; animation: git-is-rebase--commit-C-fade 27.5s linear infinite }
      #git-is-rebase .commit-D { opacity: 0; animation: git-is-rebase--commit-D-fade 27.5s linear infinite }
      #git-is-rebase .commit-E { opacity: 0; animation: git-is-rebase--commit-E-fade 27.5s linear infinite }
      #git-is-rebase .commit-F { opacity: 0; animation: git-is-rebase--commit-F-fade 27.5s linear infinite }
      #git-is-rebase .commit-G { opacity: 0; animation: git-is-rebase--commit-G-fade 27.5s linear infinite }
      #git-is-rebase .commit-Fstar { opacity: 0; animation: git-is-rebase--commit-Fstar-fade 27.5s linear infinite }
      #git-is-rebase .commit-Gstar { opacity: 0; animation: git-is-rebase--commit-Gstar-fade 27.5s linear infinite }
      #git-is-rebase .trunk-AB { opacity: 0; animation: git-is-rebase--trunk-AB-fade 27.5s linear infinite }
      #git-is-rebase .trunk-BF { opacity: 0; animation: git-is-rebase--trunk-BF-fade 27.5s linear infinite }
      #git-is-rebase .trunk-FG { opacity: 0; animation: git-is-rebase--trunk-FG-fade 27.5s linear infinite }
      #git-is-rebase .branch-BC { opacity: 0; animation: git-is-rebase--branch-BC-fade 27.5s linear infinite }
      #git-is-rebase .line-CD { opacity: 0; animation: git-is-rebase--line-CD-fade 27.5s linear infinite }
      #git-is-rebase .line-DE { opacity: 0; animation: git-is-rebase--line-DE-fade 27.5s linear infinite }
      #git-is-rebase .line-C-Fstar { opacity: 0; animation: git-is-rebase--line-C-Fstar-fade 27.5s linear infinite }
      #git-is-rebase .line-F-Gstar { opacity: 0; animation: git-is-rebase--line-F-Gstar-fade 27.5s linear infinite }
      #git-is-rebase .label-target {
        opacity: 0;
        animation:
          git-is-rebase--label-target-opacity  27.5s linear infinite,
          git-is-rebase--label-target-kf2      27.5s linear infinite,
          git-is-rebase--label-target-kf6      27.5s linear infinite,
          git-is-rebase--label-target-kf7      27.5s linear infinite,
          git-is-rebase--label-target-kf8a     27.5s linear infinite,
          git-is-rebase--label-target-kf8b     27.5s linear infinite,
          git-is-rebase--label-target-kf9      27.5s linear infinite,
          git-is-rebase--label-target-kf10     27.5s linear infinite;
        animation-composition: add;
      }
      #git-is-rebase .label-source {
        opacity: 0;
        animation:
          git-is-rebase--label-source-opacity 27.5s linear infinite,
          git-is-rebase--label-source-kf4     27.5s linear infinite,
          git-is-rebase--label-source-kf5     27.5s linear infinite;
        animation-composition: add;
      }
      @keyframes git-is-rebase--scene-fade-out {
        0%, 96.364%   { opacity: 1; animation-timing-function: ease-in }
        100%          { opacity: 0 }
      }
      #git-is-rebase-scene { animation: git-is-rebase--scene-fade-out 27.5s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-is-rebase, #git-is-rebase * { animation-delay: -25.58s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-is-rebase-scene">
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-BF" title="trunk B-F">
        <path
      d="M 180 210 L 260 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-FG" title="trunk F-G">
        <path
      d="M 260 210 L 340 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="line-C-Fstar" title="line E-F*">
        <path
      d="M 400 150 L 460 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="line-F-Gstar" title="line F*-G*">
        <path
      d="M 460 210 L 540 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    <g class="commit-F" title="commit F">
        <circle cx="260" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="260" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
    </g>
    <g class="commit-G" title="commit G">
        <circle cx="340" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="340" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
    </g>
    <g class="commit-Fstar" title="commit F*">
        <circle cx="460" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="460" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F*</text>
    </g>
    <g class="commit-Gstar" title="commit G*">
        <circle cx="540" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="540" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G*</text>
    </g>
    <g class="label-source" title="source -> C, animates to D, E, then F*">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">source</text>
    </g>
    <g class="label-target" title="target -> A, animates to B, then F, then G (final)">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">target</text>
    </g>
    </g>
</svg>
