<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="343px" height="253px" viewBox="-0.5 -0.5 343 253">
    <title>Forking and cloning a Git repository</title>
    <!-- Colors carry meaning here: purple is the reference repository, orange a fork, and green a local clone, consistent across the TS-9 repository diagrams. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <path d="M 1 16 A 65 15 0 0 1 131 16 L 131 76 A 65 15 0 0 1 1 76 Z" fill="#d9bfd9" stroke="#b380b3" stroke-width="2" style="fill: light-dark(#d9bfd9, #5c3d5c); stroke: light-dark(#b380b3, #d9a8d9);"/>
        <path d="M 1 16 A 65 15 0 0 0 131 16" fill="none" stroke="#b380b3" stroke-width="2" style="stroke: light-dark(#b380b3, #d9a8d9);"/>
        <text x="66" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Reference</text>
        <path d="M 211 16 A 65 15 0 0 1 341 16 L 341 76 A 65 15 0 0 1 211 76 Z" fill="#f7bf97" stroke="#f08b42" stroke-width="2" style="fill: light-dark(#f7bf97, #7a4f21); stroke: light-dark(#f08b42, #ffb066);"/>
        <path d="M 211 16 A 65 15 0 0 0 341 16" fill="none" stroke="#f08b42" stroke-width="2" style="stroke: light-dark(#f08b42, #ffb066);"/>
        <text x="276" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Fork</text>
        <path d="M 211 176 A 65 15 0 0 1 341 176 L 341 236 A 65 15 0 0 1 211 236 Z" fill="#c9db70" stroke="#a1b82e" stroke-width="2" style="fill: light-dark(#c9db70, #5a6b1f); stroke: light-dark(#a1b82e, #cfe066);"/>
        <path d="M 211 176 A 65 15 0 0 0 341 176" fill="none" stroke="#a1b82e" stroke-width="2" style="stroke: light-dark(#a1b82e, #cfe066);"/>
        <text x="276" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Local</text>
        <path d="M 133 46 L 200 46" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 209 46 L 199 51 L 199 41 Z" fill="currentColor" stroke="none"/>
        <text x="171" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Clone</text>
        <path d="M 276 93 L 276 150" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 276 159 L 271 149 L 281 149 Z" fill="currentColor" stroke="none"/>
        <text x="306" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Clone</text>
    </g>
</svg>
