<svg id="git-br-single-trunk-with-fast-forwards-alt" xmlns="http://www.w3.org/2000/svg" version="1.1" width="800" height="100" viewBox="0 120 800 100">
    <title>A single trunk with fast-forward commits (alternate)</title>
    <defs>
        <style>
      #git-br-single-trunk-with-fast-forwards-alt text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-br-single-trunk-with-fast-forwards-alt .stroke\=neutral\|100 { stroke: currentColor }
      #git-br-single-trunk-with-fast-forwards-alt .stroke\=neutral\|200 { stroke: currentColor }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=neutral\|200 { fill: currentColor }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=neutral\|400 { fill: currentColor }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-br-single-trunk-with-fast-forwards-alt .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-br-single-trunk-with-fast-forwards-alt .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-br-single-trunk-with-fast-forwards-alt .stroke\=signature\|orange\|400 { stroke: #e19a20 }

      /* Cycle = 23s  (2s lead-in + 8 × (KF + 1s pause) − 1s + 2s tail)
         KF timing (start% — end%):
           KF1:  8.696% — 15.217%  ( 2.0s —  3.5s)
           KF2: 19.565% — 26.087%  ( 4.5s —  6.0s)
           KF3: 30.435% — 36.957%  ( 7.0s —  8.5s)
           KF4: 41.304% — 47.826%  ( 9.5s — 11.0s)
           KF5: 52.174% — 58.696%  (12.0s — 13.5s)
           KF6: 63.043% — 69.565%  (14.5s — 16.0s)
           KF7: 73.913% — 80.435%  (17.0s — 18.5s)
           KF8: 84.783% — 91.304%  (19.5s — 21.0s) */
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-A-slide {
        0%, 41.304%        { transform: translateX(0); animation-timing-function: ease-in-out }
        47.826%, 84.783%   { transform: translateX(-300px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-600px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-B-slide {
        0%, 19.565%        { transform: translateX(0); animation-timing-function: ease-in-out }
        26.087%, 41.304%   { transform: translateX(-50px); animation-timing-function: ease-in-out }
        47.826%, 84.783%   { transform: translateX(-350px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-600px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-C-slide {
        0%, 19.565%        { transform: translateX(0); animation-timing-function: ease-in-out }
        26.087%, 41.304%   { transform: translateX(-100px); animation-timing-function: ease-in-out }
        47.826%, 84.783%   { transform: translateX(-400px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-600px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-D-slide {
        0%, 8.696%         { transform: translateX(0); animation-timing-function: ease-in-out }
        15.217%, 19.565%   { transform: translateX(-50px); animation-timing-function: ease-in-out }
        26.087%, 41.304%   { transform: translateX(-150px); animation-timing-function: ease-in-out }
        47.826%, 84.783%   { transform: translateX(-450px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-600px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-E-slide {
        0%, 8.696%         { transform: translateX(0); animation-timing-function: ease-in-out }
        15.217%, 30.435%   { transform: translateX(-100px); animation-timing-function: ease-in-out }
        36.957%, 41.304%   { transform: translateX(-200px); animation-timing-function: ease-in-out }
        47.826%, 63.043%   { transform: translateX(-300px); animation-timing-function: ease-in-out }
        69.565%, 73.913%   { transform: translateX(-500px); animation-timing-function: ease-in-out }
        80.435%, 84.783%   { transform: translateX(-525px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-600px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-F-slide {
        0%, 8.696%         { transform: translateX(0); animation-timing-function: ease-in-out }
        15.217%, 30.435%   { transform: translateX(-130px); animation-timing-function: ease-in-out }
        36.957%, 41.304%   { transform: translateX(-230px); animation-timing-function: ease-in-out }
        47.826%, 52.174%   { transform: translateX(-280px); animation-timing-function: ease-in-out }
        58.696%, 63.043%   { transform: translateX(-370px); animation-timing-function: ease-in-out }
        69.565%, 73.913%   { transform: translateX(-530px); animation-timing-function: ease-in-out }
        80.435%, 84.783%   { transform: translateX(-580px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-630px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-G-slide {
        0%, 30.435%        { transform: translateX(0); animation-timing-function: ease-in-out }
        36.957%, 52.174%   { transform: translateX(-130px); animation-timing-function: ease-in-out }
        58.696%, 63.043%   { transform: translateX(-310px); animation-timing-function: ease-in-out }
        69.565%, 73.913%   { transform: translateX(-430px); animation-timing-function: ease-in-out }
        80.435%, 84.783%   { transform: translateX(-505px); animation-timing-function: ease-in-out }
        91.304%, 100%      { transform: translateX(-530px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-H-slide {
        0%, 52.174%        { transform: translateX(0); animation-timing-function: ease-in-out }
        58.696%, 63.043%   { transform: translateX(-250px); animation-timing-function: ease-in-out }
        69.565%, 73.913%   { transform: translateX(-330px); animation-timing-function: ease-in-out }
        80.435%, 100%      { transform: translateX(-430px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-I-slide {
        0%, 52.174%        { transform: translateX(0); animation-timing-function: ease-in-out }
        58.696%, 63.043%   { transform: translateX(-250px); animation-timing-function: ease-in-out }
        69.565%, 73.913%   { transform: translateX(-290px); animation-timing-function: ease-in-out }
        80.435%, 100%      { transform: translateX(-340px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards-alt--commit-J-slide {
        0%, 52.174%    { transform: translateX(0); animation-timing-function: ease-in-out }
        58.696%, 100%  { transform: translateX(-250px) }
      }
      #git-br-single-trunk-with-fast-forwards-alt .commit-A { animation: git-br-single-trunk-with-fast-forwards-alt--commit-A-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-B { animation: git-br-single-trunk-with-fast-forwards-alt--commit-B-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-C { animation: git-br-single-trunk-with-fast-forwards-alt--commit-C-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-D { animation: git-br-single-trunk-with-fast-forwards-alt--commit-D-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-E { animation: git-br-single-trunk-with-fast-forwards-alt--commit-E-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-F { animation: git-br-single-trunk-with-fast-forwards-alt--commit-F-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-G { animation: git-br-single-trunk-with-fast-forwards-alt--commit-G-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-H { animation: git-br-single-trunk-with-fast-forwards-alt--commit-H-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-I { animation: git-br-single-trunk-with-fast-forwards-alt--commit-I-slide 23s linear infinite }
      #git-br-single-trunk-with-fast-forwards-alt .commit-J { animation: git-br-single-trunk-with-fast-forwards-alt--commit-J-slide 23s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-br-single-trunk-with-fast-forwards-alt, #git-br-single-trunk-with-fast-forwards-alt * { animation-delay: -21.39s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g title="trunk">
        <path
      d="M 20 150 L 800 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g title="trunks">
        <g title="ready">
            <path d="M 100 120 L 100 186"
        class="stroke=neutral|200"
        stroke-width="2" stroke-dasharray="2 4" />
            <text x="100" y="204" text-anchor="middle" class="fill=neutral|400">ready</text>
        </g>
        <g title="test">
            <path d="M 400 120 L 400 186"
        class="stroke=neutral|200"
        stroke-width="2" stroke-dasharray="2 4" />
            <text x="400" y="204" text-anchor="middle" class="fill=neutral|400">test</text>
        </g>
        <g title="dev">
            <path d="M 700 120 L 700 186"
        class="stroke=neutral|200"
        stroke-width="2" stroke-dasharray="2 4" />
            <text x="700" y="204" text-anchor="middle" class="fill=neutral|400">dev</text>
        </g>
    </g>
    <g title="commits">
        <g class="commit-A" title="commit A at ready">
            <circle cx="100" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="100" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
        </g>
        <g class="commit-B" title="commit B">
            <circle cx="250" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="250" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
        </g>
        <g class="commit-C" title="commit C at test">
            <circle cx="400" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
        </g>
        <g class="commit-D" title="commit D">
            <circle cx="550" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="550" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
        </g>
        <g class="commit-E" title="commit E at dev">
            <circle cx="700" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="700" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
        </g>
        <g class="commit-F" title="commit F">
            <circle cx="830" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="830" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
        </g>
        <g class="commit-G" title="commit G">
            <circle cx="830" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="830" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
        </g>
        <g class="commit-H" title="commit H">
            <circle cx="830" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="830" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">H</text>
        </g>
        <g class="commit-I" title="commit I">
            <circle cx="890" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="890" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">I</text>
        </g>
        <g class="commit-J" title="commit J">
            <circle cx="950" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="950" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">J</text>
        </g>
    </g>
</svg>
