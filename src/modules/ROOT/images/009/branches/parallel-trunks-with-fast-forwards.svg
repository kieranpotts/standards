<svg id="git-br-parallel-trunks-with-fast-forwards" xmlns="http://www.w3.org/2000/svg" version="1.1" width="800" height="240" viewBox="0 60 800 240">
    <title>Three parallel trunks — dev, test, and ready — integrated via fast-forwards</title>
    <desc>A static illustration showing three parallel horizontal trunk lines, labelled (from top to bottom) "dev", "test", and "ready", with integration points indicating where commits are fast-forwarded between trunks. Dev carries commits A through H, test carries A through F, and ready carries A through E. The vertical dashed lines show the fast-forward points: dev F integrating to test, and test E integrating to ready. This represents how changes flow progressively and efficiently from the development trunk toward the release-ready trunk through fast-forward merges.</desc>
    <defs>
        <style>
      #git-br-parallel-trunks-with-fast-forwards text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-br-parallel-trunks-with-fast-forwards .stroke\=neutral\|100 { stroke: currentColor }
      #git-br-parallel-trunks-with-fast-forwards .stroke\=neutral\|200 { stroke: currentColor }
      #git-br-parallel-trunks-with-fast-forwards .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-br-parallel-trunks-with-fast-forwards .fill\=neutral\|400 { fill: currentColor }
      #git-br-parallel-trunks-with-fast-forwards .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-br-parallel-trunks-with-fast-forwards .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-br-parallel-trunks-with-fast-forwards .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-br-parallel-trunks-with-fast-forwards .stroke\=signature\|orange\|400 { stroke: #e19a20 }
        </style>
    </defs>
    <g title="integration points">
        <path
      title="dev F to test F"
      d="M 560 140 L 560 160"
      class="stroke=neutral|200"
      stroke-width="2" stroke-dasharray="2 4" />
        <path
      title="test E to ready E"
      d="M 480 200 L 480 220"
      class="stroke=neutral|200"
      stroke-width="2" stroke-dasharray="2 4" />
    </g>
    <g title="dev trunk">
        <path
      d="M 90 120 L 800 120"
      class="stroke=neutral|100"
      stroke-width="2" />
        <text x="80" y="125" text-anchor="end" class="fill=neutral|400">dev</text>
        <g title="commits">
            <circle cx="160" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="160" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
            <circle cx="240" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="240" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
            <circle cx="320" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="320" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
            <circle cx="400" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="400" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
            <circle cx="480" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="480" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
            <circle cx="560" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="560" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
            <circle cx="640" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="640" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
            <circle cx="720" cy="120" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="720" y="120" dy="0.35em" text-anchor="middle" class="fill=neutral|800">H</text>
        </g>
    </g>
    <g title="test trunk">
        <path
      d="M 90 180 L 800 180"
      class="stroke=neutral|100"
      stroke-width="2" />
        <text x="80" y="185" text-anchor="end" class="fill=neutral|400">test</text>
        <g title="commits">
            <circle cx="160" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="160" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
            <circle cx="240" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="240" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
            <circle cx="320" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="320" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
            <circle cx="400" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="400" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
            <circle cx="480" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="480" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
            <circle cx="560" cy="180" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="560" y="180" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
        </g>
    </g>
    <g title="ready trunk">
        <path
      d="M 90 240 L 800 240"
      class="stroke=neutral|100"
      stroke-width="2" />
        <text x="80" y="245" text-anchor="end" class="fill=neutral|400">ready</text>
        <g title="commits">
            <circle cx="160" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="160" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
            <circle cx="240" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="240" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
            <circle cx="320" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="320" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
            <circle cx="400" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="400" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
            <circle cx="480" cy="240" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="480" y="240" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
        </g>
    </g>
</svg>
