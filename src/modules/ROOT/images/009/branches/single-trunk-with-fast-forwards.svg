<svg id="git-br-single-trunk-with-fast-forwards" xmlns="http://www.w3.org/2000/svg" version="1.1" width="800" height="100" viewBox="0 120 800 100">
    <title>A single trunk with fast-forward commits</title>
    <defs>
        <style>
      #git-br-single-trunk-with-fast-forwards text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-br-single-trunk-with-fast-forwards .stroke\=neutral\|100 { stroke: currentColor }
      #git-br-single-trunk-with-fast-forwards .stroke\=neutral\|200 { stroke: currentColor }
      #git-br-single-trunk-with-fast-forwards .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-br-single-trunk-with-fast-forwards .fill\=neutral\|200 { fill: currentColor }
      #git-br-single-trunk-with-fast-forwards .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-br-single-trunk-with-fast-forwards .fill\=neutral\|400 { fill: currentColor }
      #git-br-single-trunk-with-fast-forwards .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-br-single-trunk-with-fast-forwards .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-br-single-trunk-with-fast-forwards .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-br-single-trunk-with-fast-forwards .stroke\=signature\|orange\|400 { stroke: #e19a20 }

      /* Cycle = 25.5s  (2s lead-in + 9 KFs each 1.5s + 8 pauses each 1s + 2s tail)
         KF timing (start% — end%):
           KF1:  7.843% — 13.725%   ( 2.0s —  3.5s)
           KF2: 17.647% — 23.529%   ( 4.5s —  6.0s)
           KF3: 27.451% — 33.333%   ( 7.0s —  8.5s)
           KF4: 37.255% — 43.137%   ( 9.5s — 11.0s)
           KF5: 47.059% — 52.941%   (12.0s — 13.5s)
           KF6: 56.863% — 62.745%   (14.5s — 16.0s)
           KF7: 66.667% — 72.549%   (17.0s — 18.5s)
           KF8: 76.471% — 82.353%   (19.5s — 21.0s)
           KF9: 86.275% — 92.157%   (22.0s — 23.5s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-br-single-trunk-with-fast-forwards--commit-F-fade {
        0%, 7.843%    { opacity: 0; animation-timing-function: ease-out }
        13.725%, 100% { opacity: 1 }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--commit-G-fade {
        0%, 27.451%   { opacity: 0; animation-timing-function: ease-out }
        33.333%, 100% { opacity: 1 }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--commit-HIJ-fade {
        0%, 56.863%   { opacity: 0; animation-timing-function: ease-out }
        62.745%, 100% { opacity: 1 }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--dev-kf1 {
        0%, 7.843%    { transform: translateX(0); animation-timing-function: ease-in-out }
        13.725%, 100% { transform: translateX(80px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--dev-kf3 {
        0%, 27.451%   { transform: translateX(0); animation-timing-function: ease-in-out }
        33.333%, 100% { transform: translateX(80px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--dev-kf6 {
        0%, 56.863%   { transform: translateX(0); animation-timing-function: ease-in-out }
        62.745%, 100% { transform: translateX(240px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf2 {
        0%, 17.647%   { transform: translateX(0); animation-timing-function: ease-in-out }
        23.529%, 100% { transform: translateX(80px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf4-fade {
        0%, 37.255%   { opacity: 0; animation-timing-function: ease-out }
        43.137%, 100% { opacity: -1 }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf5-shift {
        0%, 47.059%   { transform: translateX(0); animation-timing-function: ease-in-out }
        52.941%, 100% { transform: translateX(80px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf5-fade {
        0%, 47.059%   { opacity: 0; animation-timing-function: ease-in-out }
        52.941%, 100% { opacity: 1 }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf7 {
        0%, 66.667%   { transform: translateX(0); animation-timing-function: ease-in-out }
        72.549%, 100% { transform: translateX(160px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--test-kf8 {
        0%, 76.471%   { transform: translateX(0); animation-timing-function: ease-in-out }
        82.353%, 100% { transform: translateX(80px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--ready-kf4 {
        0%, 37.255%   { transform: translateX(0); animation-timing-function: ease-in-out }
        43.137%, 100% { transform: translateX(240px) }
      }
      @keyframes git-br-single-trunk-with-fast-forwards--ready-kf9 {
        0%, 86.275%   { transform: translateX(0); animation-timing-function: ease-in-out }
        92.157%, 100% { transform: translateX(80px) }
      }
      #git-br-single-trunk-with-fast-forwards .commit-F { opacity: 0; animation: git-br-single-trunk-with-fast-forwards--commit-F-fade 25.5s linear infinite }
      #git-br-single-trunk-with-fast-forwards .commit-G { opacity: 0; animation: git-br-single-trunk-with-fast-forwards--commit-G-fade 25.5s linear infinite }
      #git-br-single-trunk-with-fast-forwards .commit-H, #git-br-single-trunk-with-fast-forwards .commit-I, #git-br-single-trunk-with-fast-forwards .commit-J {
        opacity: 0;
        animation: git-br-single-trunk-with-fast-forwards--commit-HIJ-fade 25.5s linear infinite;
      }
      #git-br-single-trunk-with-fast-forwards .label-dev {
        animation:
          git-br-single-trunk-with-fast-forwards--dev-kf1 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--dev-kf3 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--dev-kf6 25.5s linear infinite;
        animation-composition: add;
      }
      #git-br-single-trunk-with-fast-forwards .label-test {
        animation:
          git-br-single-trunk-with-fast-forwards--test-kf2 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--test-kf4-fade 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--test-kf5-shift 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--test-kf5-fade 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--test-kf7 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--test-kf8 25.5s linear infinite;
        animation-composition: add;
      }
      #git-br-single-trunk-with-fast-forwards .label-ready {
        animation:
          git-br-single-trunk-with-fast-forwards--ready-kf4 25.5s linear infinite,
          git-br-single-trunk-with-fast-forwards--ready-kf9 25.5s linear infinite;
        animation-composition: add;
      }
        
      @media (prefers-reduced-motion: reduce) {
        #git-br-single-trunk-with-fast-forwards, #git-br-single-trunk-with-fast-forwards * { animation-delay: -23.71s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g title="trunk">
        <path
      d="M 20 150 L 800 150"
      class="stroke=neutral|100"
      stroke-width="2" />
        <g title="commits">
            <circle cx="50" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="50" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
            <circle cx="130" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="130" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
            <circle cx="210" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="210" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
            <circle cx="290" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="290" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
            <circle cx="370" cy="150" r="20"
        class="fill=signature|green|200 stroke=signature|green|400"
        stroke-width="2" />
            <text x="370" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
            <g class="commit-F" title="commit F">
                <circle cx="450" cy="150" r="20"
          class="fill=signature|green|200 stroke=signature|green|400"
          stroke-width="2" />
                <text x="450" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
            </g>
            <g class="commit-G" title="commit G">
                <circle cx="530" cy="150" r="20"
          class="fill=signature|green|200 stroke=signature|green|400"
          stroke-width="2" />
                <text x="530" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
            </g>
            <g class="commit-H" title="commit H">
                <circle cx="610" cy="150" r="20"
          class="fill=signature|green|200 stroke=signature|green|400"
          stroke-width="2" />
                <text x="610" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">H</text>
            </g>
            <g class="commit-I" title="commit I">
                <circle cx="690" cy="150" r="20"
          class="fill=signature|green|200 stroke=signature|green|400"
          stroke-width="2" />
                <text x="690" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">I</text>
            </g>
            <g class="commit-J" title="commit J">
                <circle cx="770" cy="150" r="20"
          class="fill=signature|green|200 stroke=signature|green|400"
          stroke-width="2" />
                <text x="770" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">J</text>
            </g>
        </g>
    </g>
    <g title="labels">
        <g class="label-ready" title="ready -> A (animates to D)">
            <polygon points="50,178 45,186 55,186" class="fill=neutral|200" />
            <text x="50" y="204" text-anchor="middle" class="fill=neutral|400">ready</text>
        </g>
        <g class="label-test" title="test -> C (animates to D, fades out, then to E)">
            <polygon points="210,178 205,186 215,186" class="fill=neutral|200" />
            <text x="210" y="204" text-anchor="middle" class="fill=neutral|400">test</text>
        </g>
        <g class="label-dev" title="dev -> E (animates to F)">
            <polygon points="370,178 365,186 375,186" class="fill=neutral|200" />
            <text x="370" y="204" text-anchor="middle" class="fill=neutral|400">dev</text>
        </g>
    </g>
</svg>
