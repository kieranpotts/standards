<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="605px" height="253px" viewBox="-0.5 -0.5 605 253">
    <title>Two related Git repositories, showing commits exchanged between them</title>
    <!-- Colors carry meaning here: purple is the reference repository, orange a fork, and green a local clone, consistent across the TS-9 repository diagrams. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <path d="M 2 121 L 602 121" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 132 16 A 65 15 0 0 1 262 16 L 262 76 A 65 15 0 0 1 132 76 Z" fill="#d9bfd9" stroke="#b380b3" stroke-width="2" style="fill: light-dark(#d9bfd9, #5c3d5c); stroke: light-dark(#b380b3, #d9a8d9);"/>
        <path d="M 132 16 A 65 15 0 0 0 262 16" fill="none" stroke="#b380b3" stroke-width="2" style="stroke: light-dark(#b380b3, #d9a8d9);"/>
        <text x="197" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Reference</text>
        <path d="M 342 16 A 65 15 0 0 1 472 16 L 472 76 A 65 15 0 0 1 342 76 Z" fill="#f7bf97" stroke="#f08b42" stroke-width="2" style="fill: light-dark(#f7bf97, #7a4f21); stroke: light-dark(#f08b42, #ffb066);"/>
        <path d="M 342 16 A 65 15 0 0 0 472 16" fill="none" stroke="#f08b42" stroke-width="2" style="stroke: light-dark(#f08b42, #ffb066);"/>
        <text x="407" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Fork</text>
        <path d="M 132 176 A 65 15 0 0 1 262 176 L 262 236 A 65 15 0 0 1 132 236 Z" fill="#c9db70" stroke="#a1b82e" stroke-width="2" style="fill: light-dark(#c9db70, #5a6b1f); stroke: light-dark(#a1b82e, #cfe066);"/>
        <path d="M 132 176 A 65 15 0 0 0 262 176" fill="none" stroke="#a1b82e" stroke-width="2" style="stroke: light-dark(#a1b82e, #cfe066);"/>
        <text x="197" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Local</text>
        <path d="M 342 176 A 65 15 0 0 1 472 176 L 472 236 A 65 15 0 0 1 342 236 Z" fill="#c9db70" stroke="#a1b82e" stroke-width="2" style="fill: light-dark(#c9db70, #5a6b1f); stroke: light-dark(#a1b82e, #cfe066);"/>
        <path d="M 342 176 A 65 15 0 0 0 472 176" fill="none" stroke="#a1b82e" stroke-width="2" style="stroke: light-dark(#a1b82e, #cfe066);"/>
        <text x="407" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Local</text>
        <path d="M 264 46 L 331 46" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 340 46 L 330 51 L 330 41 Z" fill="currentColor" stroke="none"/>
        <path d="M 197 93 L 197 150" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 197 159 L 192 149 L 202 149 Z" fill="currentColor" stroke="none"/>
        <path d="M 407 93 L 407 150" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 407 159 L 402 149 L 412 149 Z" fill="currentColor" stroke="none"/>
        <text x="540" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Upstream</text>
        <text x="540" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Downstream</text>
    </g>
</svg>
