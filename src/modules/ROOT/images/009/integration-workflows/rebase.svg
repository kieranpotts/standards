<svg id="git-iw-rebase" xmlns="http://www.w3.org/2000/svg" version="1.1" width="520" height="200" viewBox="70 80 520 200">
    <title>Rebasing a branch onto another</title>
    <defs>
        <style>
      #git-iw-rebase text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-iw-rebase .stroke\=neutral\|100 { stroke: currentColor }
      #git-iw-rebase .stroke\=neutral\|200 { stroke: currentColor }
      #git-iw-rebase .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-iw-rebase .fill\=neutral\|200 { fill: currentColor }
      #git-iw-rebase .fill\=neutral\|400 { fill: currentColor }
      #git-iw-rebase .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-iw-rebase .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-iw-rebase .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-iw-rebase .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-iw-rebase .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      /* Cycle = 25.0s  (9 KFs each 1.5s + 8 pauses each 1s + 2s pause + 1.5s fade)
         KF timing (start% — end%):
           KF1:  0.000% —  6.000%   ( 0.0s —  1.5s)
           KF2: 10.000% — 16.000%   ( 2.5s —  4.0s)
           KF3: 20.000% — 26.000%   ( 5.0s —  6.5s)
           KF4: 30.000% — 36.000%   ( 7.5s —  9.0s)
           KF5: 40.000% — 46.000%   (10.0s — 11.5s)
           KF6: 50.000% — 56.000%   (12.5s — 14.0s)
           KF7: 60.000% — 66.000%   (15.0s — 16.5s)
           KF8: 70.000% — 76.000%   (17.5s — 19.0s)
           KF9: 80.000% — 86.000%   (20.0s — 21.5s)
           fade: 94.000% — 100.000% (23.5s — 25.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-iw-rebase--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--commit-B-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--trunk-AB-fade {
        0%, 10.000%   { opacity: 0; animation-timing-function: ease-out }
        16.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--label-dev-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        6.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--label-dev-kf2 {
        0%, 10.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        16.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-iw-rebase--commit-C-fade {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%       { opacity: 1 }
        74.000%       { opacity: 1; animation-timing-function: ease-in }
        76.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--branch-BC-fade {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%       { opacity: 1 }
        74.000%       { opacity: 1; animation-timing-function: ease-in }
        76.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--label-temp-opacity {
        0%, 20.000%   { opacity: 0; animation-timing-function: ease-out }
        26.000%       { opacity: 1 }
        70.000%       { opacity: 1; animation-timing-function: ease-in }
        72.000%       { opacity: 0 }
        84.000%       { opacity: 0; animation-timing-function: ease-out }
        86.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--commit-D-fade {
        0%, 30.000%   { opacity: 0; animation-timing-function: ease-out }
        36.000%       { opacity: 1 }
        72.000%       { opacity: 1; animation-timing-function: ease-in }
        74.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--line-CD-fade {
        0%, 30.000%   { opacity: 0; animation-timing-function: ease-out }
        36.000%       { opacity: 1 }
        72.000%       { opacity: 1; animation-timing-function: ease-in }
        74.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--label-temp-kf4 {
        0%, 30.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        36.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-iw-rebase--commit-E-fade {
        0%, 40.000%   { opacity: 0; animation-timing-function: ease-out }
        46.000%       { opacity: 1 }
        70.000%       { opacity: 1; animation-timing-function: ease-in }
        72.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--line-DE-fade {
        0%, 40.000%   { opacity: 0; animation-timing-function: ease-out }
        46.000%       { opacity: 1 }
        70.000%       { opacity: 1; animation-timing-function: ease-in }
        72.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase--label-temp-kf5 {
        0%, 40.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        46.000%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase .commit-A { opacity: 0; animation: git-iw-rebase--commit-A-fade 25.0s linear infinite }
      #git-iw-rebase .commit-B { opacity: 0; animation: git-iw-rebase--commit-B-fade 25.0s linear infinite }
      #git-iw-rebase .trunk-AB { opacity: 0; animation: git-iw-rebase--trunk-AB-fade 25.0s linear infinite }
      #git-iw-rebase .commit-C { opacity: 0; animation: git-iw-rebase--commit-C-fade  25.0s linear infinite }
      #git-iw-rebase .branch-BC { opacity: 0; animation: git-iw-rebase--branch-BC-fade 25.0s linear infinite }
      #git-iw-rebase .commit-D { opacity: 0; animation: git-iw-rebase--commit-D-fade  25.0s linear infinite }
      #git-iw-rebase .commit-E { opacity: 0; animation: git-iw-rebase--commit-E-fade  25.0s linear infinite }
      #git-iw-rebase .line-CD { opacity: 0; animation: git-iw-rebase--line-CD-fade   25.0s linear infinite }
      #git-iw-rebase .line-DE { opacity: 0; animation: git-iw-rebase--line-DE-fade   25.0s linear infinite }
      #git-iw-rebase .label-temp {
        opacity: 0;
        animation:
          git-iw-rebase--label-temp-opacity  25.0s linear infinite,
          git-iw-rebase--label-temp-kf4      25.0s linear infinite,
          git-iw-rebase--label-temp-kf5      25.0s linear infinite,
          git-iw-rebase--label-temp-kf9-pos  25.0s linear infinite;
        animation-composition: replace, add, add, add;
      }
      #git-iw-rebase .label-dev {
        opacity: 0;
        animation:
          git-iw-rebase--label-dev-fade  25.0s linear infinite,
          git-iw-rebase--label-dev-kf2   25.0s linear infinite,
          git-iw-rebase--label-dev-kf6   25.0s linear infinite,
          git-iw-rebase--label-dev-kf7   25.0s linear infinite;
        animation-composition: add;
      }
      @keyframes git-iw-rebase--commit-F-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--trunk-BF-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        56.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--label-dev-kf6 {
        0%, 50.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        56.000%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase .commit-F { opacity: 0; animation: git-iw-rebase--commit-F-fade 25.0s linear infinite }
      #git-iw-rebase .trunk-BF { opacity: 0; animation: git-iw-rebase--trunk-BF-fade 25.0s linear infinite }
      @keyframes git-iw-rebase--commit-G-fade {
        0%, 60.000%   { opacity: 0; animation-timing-function: ease-out }
        66.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--trunk-FG-fade {
        0%, 60.000%   { opacity: 0; animation-timing-function: ease-out }
        66.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--label-dev-kf7 {
        0%, 60.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        66.000%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase .commit-G { opacity: 0; animation: git-iw-rebase--commit-G-fade 25.0s linear infinite }
      #git-iw-rebase .trunk-FG { opacity: 0; animation: git-iw-rebase--trunk-FG-fade 25.0s linear infinite }
      @keyframes git-iw-rebase--branch-GCp-fade {
        0%, 80.000%   { opacity: 0; animation-timing-function: ease-out }
        82.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--commit-Cp-fade {
        0%, 80.000%   { opacity: 0; animation-timing-function: ease-out }
        82.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--line-CpDp-fade {
        0%, 82.000%   { opacity: 0; animation-timing-function: ease-out }
        84.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--commit-Dp-fade {
        0%, 82.000%   { opacity: 0; animation-timing-function: ease-out }
        84.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--line-DpEp-fade {
        0%, 84.000%   { opacity: 0; animation-timing-function: ease-out }
        86.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--commit-Ep-fade {
        0%, 84.000%   { opacity: 0; animation-timing-function: ease-out }
        86.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase--label-temp-kf9-pos {
        0%, 80.000% { transform: translateX(0); animation-timing-function: step-start }
        100%        { transform: translateX(160px) }
      }
      #git-iw-rebase .branch-GCp {
        opacity: 0;
        transform-origin: 340px 210px;
        animation: git-iw-rebase--branch-GCp-fade 25.0s linear infinite;
      }
      #git-iw-rebase .commit-Cp { opacity: 0; animation: git-iw-rebase--commit-Cp-fade  25.0s linear infinite }
      #git-iw-rebase .line-CpDp { opacity: 0; animation: git-iw-rebase--line-CpDp-fade  25.0s linear infinite }
      #git-iw-rebase .commit-Dp { opacity: 0; animation: git-iw-rebase--commit-Dp-fade  25.0s linear infinite }
      #git-iw-rebase .line-DpEp { opacity: 0; animation: git-iw-rebase--line-DpEp-fade  25.0s linear infinite }
      #git-iw-rebase .commit-Ep { opacity: 0; animation: git-iw-rebase--commit-Ep-fade  25.0s linear infinite }
      @keyframes git-iw-rebase--scene-fade-out {
        0%, 94.000%   { opacity: 1; animation-timing-function: ease-in }
        100%      { opacity: 0 }
      }
      #git-iw-rebase-scene { animation: git-iw-rebase--scene-fade-out 25.0s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-iw-rebase, #git-iw-rebase * { animation-delay: -23.25s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-iw-rebase-scene">
    <g class="branch-GCp" title="branch G-C*">
        <path
      d="M 340 210 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-FG" title="trunk F-G">
        <path
      d="M 260 210 L 340 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-BF" title="trunk B-F">
        <path
      d="M 180 210 L 260 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commits-CDE" title="commits C, D, E (animates onto trunk at KF8)">
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    </g>
    <g class="commits-Cp-Dp-Ep" title="commits C*, D*, E*">
        <g class="line-CpDp" title="line C*-D*">
            <path
        d="M 400 150 L 480 150"
        class="stroke=neutral|100"
        stroke-width="2" />
        </g>
        <g class="commit-Cp" title="commit C*">
            <circle cx="400" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C*</text>
        </g>
        <g class="line-DpEp" title="line D*-E*">
            <path
        d="M 480 150 L 560 150"
        class="stroke=neutral|100"
        stroke-width="2" />
        </g>
        <g class="commit-Dp" title="commit D*">
            <circle cx="480" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="480" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D*</text>
        </g>
        <g class="commit-Ep" title="commit E*">
            <circle cx="560" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="560" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E*</text>
        </g>
    </g>
    <g class="commit-G" title="commit G">
        <circle cx="340" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="340" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
    </g>
    <g class="commit-F" title="commit F">
        <circle cx="260" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="260" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
    </g>
<g class="label-temp" title="temp -> C, animates to D, then E">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">temp</text>
    </g>
    <g class="label-dev" title="dev -> A, animates to B, then E">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">dev</text>
    </g>
    </g>
</svg>
