<svg id="git-iw-rebase-plus-ff-merge" xmlns="http://www.w3.org/2000/svg" version="1.1" width="540" height="200" viewBox="70 80 540 200">
    <title>Rebasing a branch, then fast-forward merging it</title>
    <defs>
        <style>
      #git-iw-rebase-plus-ff-merge text {
        fill: currentColor;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #git-iw-rebase-plus-ff-merge .stroke\=neutral\|100 { stroke: currentColor }
      #git-iw-rebase-plus-ff-merge .stroke\=neutral\|200 { stroke: currentColor }
      #git-iw-rebase-plus-ff-merge .fill\=neutral\|100 { fill: hsl(0, 0%, 95%) }
      #git-iw-rebase-plus-ff-merge .fill\=neutral\|200 { fill: currentColor }
      #git-iw-rebase-plus-ff-merge .fill\=neutral\|400 { fill: currentColor }
      #git-iw-rebase-plus-ff-merge .fill\=neutral\|800 { fill: hsl(0, 0%, 20%) }
      #git-iw-rebase-plus-ff-merge .fill\=signature\|green\|200 { fill: hsl(70, 60%, 65%) }
      #git-iw-rebase-plus-ff-merge .stroke\=signature\|green\|400 { stroke: hsl(70, 60%, 45%) }
      #git-iw-rebase-plus-ff-merge .fill\=signature\|orange\|200 { fill: #ffc157 }
      #git-iw-rebase-plus-ff-merge .stroke\=signature\|orange\|400 { stroke: #e19a20 }
      /* Cycle = 30.0s  (11 KFs each 1.5s + 10 pauses each 1s + 2s pause + 1.5s fade)
         KF timing (start% — end%):
           KF1:   0.000% —  5.000%   ( 0.0s —  1.5s)
           KF2:   8.333% — 13.333%   ( 2.5s —  4.0s)
           KF3:  16.667% — 21.667%   ( 5.0s —  6.5s)
           KF4:  25.000% — 30.000%   ( 7.5s —  9.0s)
           KF5:  33.333% — 38.333%   (10.0s — 11.5s)
           KF6:  41.667% — 46.667%   (12.5s — 14.0s)
           KF7:  50.000% — 55.000%   (15.0s — 16.5s)
           KF8:  58.333% — 63.333%   (17.5s — 19.0s)
           KF9:  66.667% — 71.667%   (20.0s — 21.5s)
           KF10: 75.000% — 80.000%   (22.5s — 24.0s)
           KF11: 83.333% — 88.333%   (25.0s — 26.5s)
           fade: 95.000% — 100.000% (28.5s — 30.0s)
         Transform sub-animations compose additively (each contributes a delta from 0).
         Opacity fades also use additive composition with delta encoding (-1 fades out, +1 fades in). */
      @keyframes git-iw-rebase-plus-ff-merge--commit-A-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        5.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-B-fade {
        0%, 8.333%   { opacity: 0; animation-timing-function: ease-out }
        13.333%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--trunk-AB-fade {
        0%, 8.333%   { opacity: 0; animation-timing-function: ease-out }
        13.333%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-fade {
        0%    { opacity: 0; animation-timing-function: ease-out }
        5.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-kf2 {
        0%, 8.333%   { transform: translateX(0); animation-timing-function: ease-in-out }
        13.333%, 100% { transform: translateX(80px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-C-fade {
        0%, 16.667%   { opacity: 0; animation-timing-function: ease-out }
        21.667%       { opacity: 1 }
        61.667%       { opacity: 1; animation-timing-function: ease-in }
        63.333%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--branch-BC-fade {
        0%, 16.667%   { opacity: 0; animation-timing-function: ease-out }
        21.667%       { opacity: 1 }
        61.667%       { opacity: 1; animation-timing-function: ease-in }
        63.333%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-temp-opacity {
        0%, 16.667%   { opacity: 0; animation-timing-function: ease-out }
        21.667%       { opacity: 1 }
        58.333%       { opacity: 1; animation-timing-function: ease-in }
        60.000%       { opacity: 0 }
        70.000%       { opacity: 0; animation-timing-function: ease-out }
        71.667%       { opacity: 1 }
        83.333%       { opacity: 1; animation-timing-function: ease-in }
        88.333%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-D-fade {
        0%, 25.000%   { opacity: 0; animation-timing-function: ease-out }
        30.000%       { opacity: 1 }
        60.000%       { opacity: 1; animation-timing-function: ease-in }
        61.667%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--line-CD-fade {
        0%, 25.000%   { opacity: 0; animation-timing-function: ease-out }
        30.000%       { opacity: 1 }
        60.000%       { opacity: 1; animation-timing-function: ease-in }
        61.667%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-temp-kf4 {
        0%, 25.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        30.000%, 100% { transform: translateX(80px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-E-fade {
        0%, 33.333%   { opacity: 0; animation-timing-function: ease-out }
        38.333%       { opacity: 1 }
        58.333%       { opacity: 1; animation-timing-function: ease-in }
        60.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--line-DE-fade {
        0%, 33.333%   { opacity: 0; animation-timing-function: ease-out }
        38.333%       { opacity: 1 }
        58.333%       { opacity: 1; animation-timing-function: ease-in }
        60.000%, 100% { opacity: 0 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-temp-kf5 {
        0%, 33.333%   { transform: translateX(0); animation-timing-function: ease-in-out }
        38.333%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase-plus-ff-merge .commit-A { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-A-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-B { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-B-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .trunk-AB { opacity: 0; animation: git-iw-rebase-plus-ff-merge--trunk-AB-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-C { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-C-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .branch-BC { opacity: 0; animation: git-iw-rebase-plus-ff-merge--branch-BC-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-D { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-D-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-E { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-E-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .line-CD { opacity: 0; animation: git-iw-rebase-plus-ff-merge--line-CD-fade   30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .line-DE { opacity: 0; animation: git-iw-rebase-plus-ff-merge--line-DE-fade   30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .label-temp {
        opacity: 0;
        animation:
          git-iw-rebase-plus-ff-merge--label-temp-opacity  30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-temp-kf4      30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-temp-kf5      30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-temp-kf9-pos  30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-temp-kf11     30.0s linear infinite;
        animation-composition: replace, add, add, add, add;
      }
      #git-iw-rebase-plus-ff-merge .label-dev {
        opacity: 0;
        animation:
          git-iw-rebase-plus-ff-merge--label-dev-fade  30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-dev-kf2   30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-dev-kf6   30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-dev-kf7   30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-dev-kf10  30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--label-dev-kf11  30.0s linear infinite;
        animation-composition: add;
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-F-fade {
        0%, 41.667%   { opacity: 0; animation-timing-function: ease-out }
        46.667%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--trunk-BF-fade {
        0%, 41.667%   { opacity: 0; animation-timing-function: ease-out }
        46.667%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-kf6 {
        0%, 41.667%   { transform: translateX(0); animation-timing-function: ease-in-out }
        46.667%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase-plus-ff-merge .commit-F { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-F-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .trunk-BF { opacity: 0; animation: git-iw-rebase-plus-ff-merge--trunk-BF-fade 30.0s linear infinite }
      @keyframes git-iw-rebase-plus-ff-merge--commit-G-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        55.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--trunk-FG-fade {
        0%, 50.000%   { opacity: 0; animation-timing-function: ease-out }
        55.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-kf7 {
        0%, 50.000%   { transform: translateX(0); animation-timing-function: ease-in-out }
        55.000%, 100% { transform: translateX(80px) }
      }
      #git-iw-rebase-plus-ff-merge .commit-G { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-G-fade 30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .trunk-FG { opacity: 0; animation: git-iw-rebase-plus-ff-merge--trunk-FG-fade 30.0s linear infinite }
      @keyframes git-iw-rebase-plus-ff-merge--branch-GCp-fade {
        0%, 66.667%   { opacity: 0; animation-timing-function: ease-out }
        68.333%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-Cp-fade {
        0%, 66.667%   { opacity: 0; animation-timing-function: ease-out }
        68.333%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--line-CpDp-fade {
        0%, 68.333%   { opacity: 0; animation-timing-function: ease-out }
        70.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-Dp-fade {
        0%, 68.333%   { opacity: 0; animation-timing-function: ease-out }
        70.000%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--line-DpEp-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        71.667%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commit-Ep-fade {
        0%, 70.000%   { opacity: 0; animation-timing-function: ease-out }
        71.667%, 100% { opacity: 1 }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-temp-kf9-pos {
        0%, 66.667% { transform: translateX(0); animation-timing-function: step-start }
        100%        { transform: translateX(160px) }
      }
      #git-iw-rebase-plus-ff-merge .branch-GCp {
        opacity: 0;
        transform-origin: 340px 210px;
        animation:
          git-iw-rebase-plus-ff-merge--branch-GCp-fade 30.0s linear infinite,
          git-iw-rebase-plus-ff-merge--branch-GCp-kf11 30.0s linear infinite;
        animation-composition: add;
      }
      #git-iw-rebase-plus-ff-merge .commits-Cp-Dp-Ep {
        animation: git-iw-rebase-plus-ff-merge--commits-Cp-Dp-Ep-kf11 30.0s linear infinite;
        animation-composition: add;
      }
      #git-iw-rebase-plus-ff-merge .commit-Cp { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-Cp-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .line-CpDp { opacity: 0; animation: git-iw-rebase-plus-ff-merge--line-CpDp-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-Dp { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-Dp-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .line-DpEp { opacity: 0; animation: git-iw-rebase-plus-ff-merge--line-DpEp-fade  30.0s linear infinite }
      #git-iw-rebase-plus-ff-merge .commit-Ep { opacity: 0; animation: git-iw-rebase-plus-ff-merge--commit-Ep-fade  30.0s linear infinite }
      @keyframes git-iw-rebase-plus-ff-merge--branch-GCp-kf11 {
        0%, 83.333%   { transform: rotate(0deg); animation-timing-function: ease-in-out }
        88.333%, 100% { transform: rotate(45deg) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--commits-Cp-Dp-Ep-kf11 {
        0%, 83.333%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        88.333%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-kf10 {
        0%, 75.000%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        80.000%, 100% { transform: translate(220px, -60px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-dev-kf11 {
        0%, 83.333%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        88.333%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--label-temp-kf11 {
        0%, 83.333%   { transform: translate(0, 0); animation-timing-function: ease-in-out }
        88.333%, 100% { transform: translate(20px, 60px) }
      }
      @keyframes git-iw-rebase-plus-ff-merge--scene-fade-out {
        0%, 95.000%   { opacity: 1; animation-timing-function: ease-in }
        100%      { opacity: 0 }
      }
      #git-iw-rebase-plus-ff-merge-scene { animation: git-iw-rebase-plus-ff-merge--scene-fade-out 30.0s linear infinite }
        
      @media (prefers-reduced-motion: reduce) {
        #git-iw-rebase-plus-ff-merge, #git-iw-rebase-plus-ff-merge * { animation-delay: -27.9s !important; animation-play-state: paused !important }
      }
    </style>
    </defs>
    <g id="git-iw-rebase-plus-ff-merge-scene">
    <g class="branch-GCp" title="branch G-C*">
        <path
      d="M 340 210 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-FG" title="trunk F-G">
        <path
      d="M 260 210 L 340 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-BF" title="trunk B-F">
        <path
      d="M 180 210 L 260 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="branch-BC" title="branch B-C">
        <path
      d="M 180 210 L 240 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="trunk-AB" title="trunk A-B">
        <path
      d="M 100 210 L 180 210"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-A" title="commit A">
        <circle cx="100" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="100" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">A</text>
    </g>
    <g class="commit-B" title="commit B">
        <circle cx="180" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="180" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">B</text>
    </g>
    <g class="commits-CDE" title="commits C, D, E (animates onto trunk at KF8)">
    <g class="line-CD" title="line C-D">
        <path
      d="M 240 150 L 320 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-C" title="commit C">
        <circle cx="240" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="240" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C</text>
    </g>
    <g class="line-DE" title="line D-E">
        <path
      d="M 320 150 L 400 150"
      class="stroke=neutral|100"
      stroke-width="2" />
    </g>
    <g class="commit-D" title="commit D">
        <circle cx="320" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="320" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D</text>
    </g>
    <g class="commit-E" title="commit E">
        <circle cx="400" cy="150" r="20"
      class="fill=signature|orange|200 stroke=signature|orange|400"
      stroke-width="2" />
        <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E</text>
    </g>
    </g>
    <g class="commits-Cp-Dp-Ep" title="commits C*, D*, E* (translate to trunk at KF11)">
        <g class="line-CpDp" title="line C*-D*">
            <path
        d="M 400 150 L 480 150"
        class="stroke=neutral|100"
        stroke-width="2" />
        </g>
        <g class="commit-Cp" title="commit C*">
            <circle cx="400" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="400" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">C*</text>
        </g>
        <g class="line-DpEp" title="line D*-E*">
            <path
        d="M 480 150 L 560 150"
        class="stroke=neutral|100"
        stroke-width="2" />
        </g>
        <g class="commit-Dp" title="commit D*">
            <circle cx="480" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="480" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">D*</text>
        </g>
        <g class="commit-Ep" title="commit E*">
            <circle cx="560" cy="150" r="20"
        class="fill=signature|orange|200 stroke=signature|orange|400"
        stroke-width="2" />
            <text x="560" y="150" dy="0.35em" text-anchor="middle" class="fill=neutral|800">E*</text>
        </g>
    </g>
    <g class="commit-G" title="commit G">
        <circle cx="340" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="340" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">G</text>
    </g>
    <g class="commit-F" title="commit F">
        <circle cx="260" cy="210" r="20"
      class="fill=signature|green|200 stroke=signature|green|400"
      stroke-width="2" />
        <text x="260" y="210" dy="0.35em" text-anchor="middle" class="fill=neutral|800">F</text>
    </g>
<g class="label-temp" title="temp -> C, animates to D, then E">
        <polygon points="240,122 235,114 245,114" class="fill=neutral|200" />
        <text x="240" y="107" text-anchor="middle" class="fill=neutral|400">temp</text>
    </g>
    <g class="label-dev" title="dev -> A, animates to B, then E">
        <polygon points="100,238 95,246 105,246" class="fill=neutral|200" />
        <text x="100" y="264" text-anchor="middle" class="fill=neutral|400">dev</text>
    </g>
    </g>
</svg>
