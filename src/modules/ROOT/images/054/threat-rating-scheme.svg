<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="680px" height="516px" viewBox="-0.5 -0.5 680 516">
    <title>A threat rating matrix plotting likelihood against impact, and a key mapping high, medium, and low likelihood or impact to a high, medium, or low threat rating</title>
    <!-- Colors carry meaning here: red, amber, and green mark high, medium, and low threat ratings. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <rect x="60" y="1" width="240" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="180" y="19" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Likelihood</text>
        <text x="60" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Exploitation</text>
        <path d="M 60 66 L 60 286" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 60 286 L 300 286" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 180 66 L 180 286" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 60 176 L 300 176" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="34" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Easy</text>
        <text x="34" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Hard</text>
        <text x="80" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Few</text>
        <text x="280" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Many</text>
        <text x="180" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Countermeasures</text>
        <text x="120" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">High</text>
        <text x="240" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Medium</text>
        <text x="120" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Medium</text>
        <text x="240" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Low</text>
        <rect x="400" y="1" width="240" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="520" y="19" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Impact</text>
        <text x="400" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Customers</text>
        <path d="M 400 66 L 400 286" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 400 286 L 640 286" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 520 66 L 520 286" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 400 176 L 640 176" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="374" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Many</text>
        <text x="374" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Few</text>
        <text x="420" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Minor</text>
        <text x="620" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Major</text>
        <text x="520" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Damage Potential</text>
        <text x="460" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Medium</text>
        <text x="580" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">High</text>
        <text x="460" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Low</text>
        <text x="580" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Medium</text>
        <text x="340" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Threat Rating</text>
        <text x="250" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">High likelihood OR high impact =</text>
        <rect x="400" y="393" width="120" height="34" fill="#cc0000" stroke="none" style="fill: light-dark(rgb(204, 0, 0), rgb(255, 163, 163));"/>
        <text x="460" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="#ffffff" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));">High</text>
        <text x="250" y="454" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Medium likelihood OR medium impact =</text>
        <rect x="400" y="437" width="120" height="34" fill="#cc6600" stroke="none" style="fill: light-dark(rgb(204, 102, 0), rgb(255, 178, 102));"/>
        <text x="460" y="454" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="#ffffff" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));">Medium</text>
        <text x="250" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Low likelihood OR low impact =</text>
        <rect x="400" y="481" width="120" height="34" fill="#009900" stroke="none" style="fill: light-dark(rgb(0, 153, 0), rgb(50, 181, 50));"/>
        <text x="460" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="#ffffff" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));">Low</text>
    </g>
</svg>
